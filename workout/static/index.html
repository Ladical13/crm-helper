<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover is load-bearing: style.css derives --safe-top and
       --safe-bot from env(safe-area-inset-*) and uses them on the header, the
       tab bar, the rest timer and the picker sheet. Without it those resolve to
       0 and the tab bar sits under the home indicator — which is where the
       thumb lands. user-scalable=no stays: the set inputs are 17px so iOS does
       not zoom into them on focus, and a stray pinch mid-set is never intended. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1117">
  <title>P1 Lift</title>
  <!-- Relative, not rooted. The other three apps hardcode their mount prefix
       here and therefore render unstyled anywhere else; relative hrefs mean
       this page works standalone at / AND mounted under a prefix, which is the
       only reason it can be developed without the portal running. -->
  <link rel="stylesheet" href="static/style.css?v=1">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<header>
  <h1>P1 <span>Lift</span></h1>
  <div class="header-stat" id="hdr-stat"></div>
</header>

<main>
  <!-- ── Lift tab ── -->
  <section id="tab-lift">
    <div id="lift-idle" class="hidden">
      <div class="card">
        <h2>Start training</h2>
        <button class="btn btn-primary btn-wide" id="start-empty">Start empty workout</button>
        <div id="routine-list" style="margin-top:12px"></div>
      </div>
      <div class="card" id="last-session"></div>
    </div>

    <div id="lift-active" class="hidden">
      <div class="card workout-head">
        <input class="name" id="w-name" placeholder="Workout name" autocomplete="off">
        <div class="totals">
          <div>Elapsed<b id="w-elapsed">0:00</b></div>
          <div>Sets<b id="w-sets" class="num">0</b></div>
          <div>Volume<b id="w-volume" class="num">0</b></div>
        </div>
      </div>

      <div id="exercises"></div>

      <button class="btn btn-wide" id="add-exercise">+ Add exercise</button>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-good" style="flex:1" id="finish">Finish workout</button>
        <button class="btn btn-danger" id="scrap">Scrap</button>
      </div>
    </div>
  </section>

  <!-- ── History tab ── -->
  <section id="tab-history" class="hidden">
    <div class="card"><h2>History</h2><div id="history"></div></div>
  </section>

  <!-- ── Records tab ── -->
  <section id="tab-records" class="hidden">
    <div class="card">
      <h2>Numbers</h2>
      <div class="totals" id="stat-tiles"></div>
      <div class="small muted hidden" id="stat-note" style="margin-top:10px"></div>
      <div class="small muted" style="margin-top:14px">Weekly volume</div>
      <div class="spark" id="spark"></div>
      <div class="spark-x" id="spark-x"></div>
    </div>
    <div class="card">
      <div class="spread"><h2 style="margin:0">Personal records</h2>
        <button class="btn btn-sm" id="unit-toggle"></button></div>
      <div id="records" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<!-- Rest timer: fixed above the tab bar so it is visible from any tab, because
     the whole point is that it keeps running while you look at last week's
     numbers. -->
<div id="rest" class="hidden">
  <div class="t" id="rest-t">1:30</div>
  <div class="bar"><i id="rest-bar" style="width:100%"></i></div>
  <button id="rest-add">+30s</button>
  <button id="rest-skip">Skip</button>
</div>

<nav>
  <button data-tab="lift" class="on"><span>🏋️</span>Lift</button>
  <button data-tab="history"><span>📅</span>History</button>
  <button data-tab="records"><span>🏆</span>Records</button>
</nav>

<div id="sheet" class="sheet-bg hidden">
  <div class="sheet">
    <div class="spread"><b id="sheet-title">Add exercise</b>
      <button class="btn btn-sm" id="sheet-close">Close</button></div>
    <input class="search" id="sheet-search" placeholder="Search or type a new movement" autocomplete="off">
    <div class="list" id="sheet-list"></div>
    <button class="btn btn-primary hidden" id="sheet-create"></button>
  </div>
</div>

<script src="static/app.js?v=1"></script>
<script>
  // Registered from the page, not app.js, so a JS error in the app still leaves
  // the offline shell installed. The worker is served from the app ROOT
  // (/sw.js), not /static/: a worker can only claim a scope at or below its own
  // path. Relative paths keep this correct standalone and mounted.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      var base = location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
      navigator.serviceWorker.register(base + '/sw.js', { scope: base + '/' })
        .catch(function () { /* offline is a bonus, never a blocker */ });
    });
  }
</script>
</body>
</html>
