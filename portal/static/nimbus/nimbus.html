<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nimbus — Project One</title>
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#000814">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg:        #000814;
    --panel:    #071026;
    --panel-2: #0b1735;
    --border:  #1a2947;
    --border-2:#2a3e6a;
    --text:    #d7e6ff;
    --dim:     #6f89b8;
    --dim2:    #4a608a;
    --accent:  #22d3ee;
    --accent-2:#38bdf8;
    --warn:    #f59e0b;
    --danger:  #ef4444;
    --ok:      #22c55e;
    --violet:  #8b5cf6;
    --gradient: linear-gradient(135deg, var(--accent) 0%, var(--violet) 100%);
  }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.55 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top, 0) 0 0;
    background-image:
      radial-gradient(1000px 500px at 15% -20%, rgba(34,211,238,.12), transparent),
      radial-gradient(900px 500px at 90% 15%, rgba(139,92,246,.12), transparent);
    background-attachment: fixed;
  }
  code, .mono, .num { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; }

  /* ── Top strip ───────────────────────────────────────────────────────── */
  header {
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 16px; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: rgba(0,8,20,.7); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .glyph {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--gradient); display: grid; place-items: center;
    box-shadow: 0 0 32px rgba(34,211,238,.4);
    font-size: 18px;
  }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: .3px; font-weight: 700; }
  .brand small { display: block; color: var(--dim); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }

  .cost {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; border: 1px solid var(--border-2); border-radius: 999px;
    background: var(--panel); font-size: 13px;
  }
  .cost .lbl { color: var(--dim); }
  .cost .num { font-weight: 700; color: var(--accent); }
  .cost.warn .num { color: var(--warn); }
  .cost.warn { border-color: var(--warn); box-shadow: 0 0 20px rgba(245,158,11,.2); }
  .cost.hot  .num { color: var(--danger); }
  .cost.hot  { border-color: var(--danger); box-shadow: 0 0 20px rgba(239,68,68,.3); animation: pulse 2s ease-in-out infinite; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; font-size: 12px; color: var(--dim);
    border-radius: 999px; background: var(--panel);
    border: 1px solid var(--border-2);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.off  { background: var(--dim2); box-shadow: none; }

  header a.exit {
    color: var(--dim); text-decoration: none; font-size: 13px;
    border: 1px solid var(--border-2); border-radius: 9px; padding: 6px 12px;
  }
  header a.exit:hover { color: var(--text); border-color: var(--accent); }

  /* ── Nav bar ─────────────────────────────────────────────────────────── */
  nav {
    display: flex; gap: 4px; padding: 10px 20px; border-bottom: 1px solid var(--border);
    background: rgba(7,16,38,.6);
    overflow-x: auto;
  }
  nav a {
    color: var(--dim); text-decoration: none; padding: 8px 14px;
    font-size: 13px; border-radius: 8px; white-space: nowrap;
  }
  nav a:hover { color: var(--text); background: var(--panel); }
  nav a.on { color: var(--accent); background: var(--panel-2); border: 1px solid var(--border-2); }

  /* ── Main layout ─────────────────────────────────────────────────────── */
  main { padding: 24px 20px 48px; max-width: 1600px; margin: 0 auto; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: minmax(300px, 1fr) minmax(400px, 2fr) minmax(300px, 1fr);
  }
  @media (max-width: 1100px) {
    .grid { grid-template-columns: 1fr; }
  }

  section.panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  section.panel h2 {
    margin: 0 0 14px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--dim); font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  section.panel h2 .count { color: var(--accent); font-size: 12px; }

  /* Rep cards */
  .rep {
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
    transition: border-color .15s, transform .15s;
  }
  .rep:hover { border-color: var(--accent); transform: translateY(-1px); }
  .rep .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .rep .name { font-weight: 600; font-size: 14px; }
  .rep .terr { color: var(--dim); font-size: 12px; }
  .rep .stats { display: flex; gap: 12px; color: var(--dim); font-size: 12px; margin: 6px 0 10px; }
  .rep .stat b { color: var(--text); font-weight: 600; }
  .rep .cap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 8px 0; }
  .rep .cap > div { height: 100%; background: var(--gradient); }
  .rep .btn {
    display: inline-block; padding: 6px 12px; font-size: 12px; border-radius: 7px;
    background: var(--gradient); color: #001; font-weight: 700;
    border: none; cursor: pointer; text-decoration: none; font-family: inherit;
  }
  .rep .btn:hover { filter: brightness(1.1); }
  .rep .btn.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border-2); }
  .rep .btn.ghost:hover { color: var(--accent); border-color: var(--accent); }
  .rep .btn:disabled { opacity: .5; cursor: default; filter: none; }
  .rep .row { display: flex; gap: 6px; align-items: center; }

  /* Pipeline */
  .stages { display: grid; gap: 6px; margin: 8px 0 14px; }
  .stage-row {
    display: grid; grid-template-columns: 130px 1fr auto;
    align-items: center; gap: 10px; font-size: 13px;
  }
  .stage-row .lbl { color: var(--dim); }
  .stage-row .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .stage-row .bar > div { height: 100%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .stage-row .num { font-weight: 600; text-align: right; min-width: 40px; }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .kv .k { color: var(--dim); }
  .kv .v { font-weight: 700; color: var(--accent); }
  .kv .v.hot { color: var(--ok); }

  /* Topics + drafts */
  .topic {
    padding: 10px 12px; margin-bottom: 8px;
    background: var(--panel-2); border-left: 3px solid var(--accent); border-radius: 6px;
  }
  .topic .t-hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .topic h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .topic .score { font-size: 12px; color: var(--accent); font-weight: 700; }
  .topic p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
  .topic .cite-row { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .topic .cite-row a { font-size: 11px; color: var(--dim); text-decoration: none;
    background: var(--panel); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .topic .cite-row a:hover { color: var(--accent); border-color: var(--accent); }
  .topic .actions { margin-top: 8px; }

  .draft {
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 10px;
    padding: 14px; margin-bottom: 12px;
  }
  .draft .head { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .draft .platform { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
  .draft .status { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); }
  .draft h4 { margin: 0 0 8px; font-size: 14px; }
  .draft .body { color: var(--dim); font-size: 13px; white-space: pre-wrap; padding: 10px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }
  .draft .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .draft .btn { padding: 6px 12px; font-size: 12px; border-radius: 7px;
     background: transparent; color: var(--dim); border: 1px solid var(--border-2); cursor: pointer; font-family: inherit; }
  .draft .btn.primary { background: var(--gradient); color: #001; font-weight: 700; border: none; }
  .draft .btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Settings */
  .settings { display: grid; gap: 14px; max-width: 640px; }
  .settings label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .settings input, .settings select, .settings textarea {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border-2);
    color: var(--text); border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .settings input:focus, .settings select:focus { outline: none; border-color: var(--accent); }
  .settings .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .settings button { padding: 10px 18px; background: var(--gradient); color: #001; font-weight: 700; border: none;
    border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px; }

  /* Connections */
  .conn {
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .conn .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conn .name { font-weight: 600; font-size: 14px; }
  .conn .pill {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px; border: 1px solid;
  }
  .conn .pill.connected     { color: var(--ok);     border-color: var(--ok);     background: rgba(34,197,94,.1); }
  .conn .pill.not_connected { color: var(--dim);    border-color: var(--border-2); background: var(--panel); }
  .conn .pill.error         { color: var(--danger); border-color: var(--danger); background: rgba(239,68,68,.1); }
  .conn .pill.checking      { color: var(--warn);   border-color: var(--warn);   background: rgba(245,158,11,.1); }
  /* Owner-gated: deliberately muted, NOT red. Nobody here can fix these, so
     styling them as failures would train people to ignore the whole page. */
  .conn .pill.owner_required { color: var(--dim);   border-color: var(--dim2);   background: transparent; }
  .conn .pill.approval_required { color: var(--dim); border-color: var(--dim2); background: transparent; }
  .conn.optional { opacity: .78; border-style: dashed; }
  .conn .tier {
    font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--violet); border: 1px solid var(--violet); border-radius: 999px;
    padding: 2px 8px; background: rgba(139,92,246,.08);
  }
  .conn .authtag { font-size: 11px; color: var(--dim2); text-transform: uppercase; letter-spacing: 1px; }
  .conn .detail { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .conn .reads  { margin-top: 4px; font-size: 12px; color: var(--dim2); }
  .conn .caveat {
    margin-top: 8px; font-size: 12px; color: var(--warn); line-height: 1.5;
    background: rgba(245,158,11,.07); border-left: 2px solid var(--warn);
    padding: 7px 10px; border-radius: 0 6px 6px 0;
  }
  .conn .envs { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .conn .env {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg); color: var(--dim2);
  }
  .conn .env.set   { color: var(--ok); border-color: rgba(34,197,94,.4); }
  .conn .env.unset { color: var(--dim2); }
  .conn .env.unset.required { color: var(--warn); border-color: rgba(245,158,11,.4); }
  .conn details { margin-top: 10px; }
  .conn summary { cursor: pointer; font-size: 12px; color: var(--dim); }
  .conn summary:hover { color: var(--accent); }
  .conn .howto { margin-top: 8px; font-size: 12px; color: var(--dim); line-height: 1.6; }
  .conn .howto b { color: var(--text); font-weight: 600; }
  .conn .howto code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; font-size: 11px; color: var(--accent-2);
  }
  /* Local SEO */
  .rec {
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .rec.approved { border-color: rgba(34,197,94,.45); }
  .rec.rejected { opacity: .5; }
  .rec .head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 7px; }
  .rec .rank { font-weight: 700; color: var(--accent); font-size: 13px; min-width: 26px; }
  .rec .cat {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700;
    padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border-2); color: var(--dim);
  }
  .rec .cat.technical_website_fix { color: var(--warn); border-color: rgba(245,158,11,.5); }
  .rec .cat.improve_existing_page { color: var(--accent-2); border-color: rgba(56,189,248,.5); }
  .rec .cat.google_business_profile_opportunity { color: var(--violet); border-color: rgba(139,92,246,.5); }
  .rec .basis {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim2);
    border: 1px dashed var(--border-2); border-radius: 999px; padding: 2px 8px;
  }
  .rec .conf { font-size: 11px; color: var(--dim2); }
  .rec .score { margin-left: auto; font-size: 12px; color: var(--accent); font-weight: 700; }
  .rec .action { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .rec .ctx { font-size: 12px; color: var(--dim2); margin-bottom: 6px; }
  .rec .intent {
    font-size: 12px; color: var(--text); font-style: italic; margin: 6px 0;
    border-left: 2px solid var(--accent); padding-left: 9px;
  }
  .rec .why { font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .rec .check {
    font-size: 12px; color: var(--warn); background: rgba(245,158,11,.07);
    border-left: 2px solid var(--warn); padding: 7px 10px; border-radius: 0 6px 6px 0;
    margin-bottom: 8px;
  }
  .rec .ev { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .rec .ev a {
    font-size: 11px; color: var(--dim2); text-decoration: none; background: var(--bg);
    padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border);
  }
  .rec .ev a:hover { color: var(--accent); border-color: var(--accent); }
  .rec .acts { display: flex; gap: 6px; }
  .rec .acts button {
    padding: 5px 12px; font-size: 12px; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--dim); border: 1px solid var(--border-2);
    font-family: inherit;
  }
  .rec .acts button.ok:hover   { color: var(--ok); border-color: var(--ok); }
  .rec .acts button.no:hover   { color: var(--danger); border-color: var(--danger); }
  .seo-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .seo-bar button {
    padding: 8px 15px; font-size: 13px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--gradient); color: #001; font-weight: 700; font-family: inherit;
  }
  .seo-bar button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border-2); }
  .seo-bar button:disabled { opacity: .5; cursor: default; }
  .seo-bar select {
    padding: 8px 11px; background: var(--bg); border: 1px solid var(--border-2);
    color: var(--text); border-radius: 8px; font-size: 13px; font-family: inherit;
  }
  .md {
    font-size: 13px; color: var(--dim); line-height: 1.65; max-height: 460px;
    overflow: auto; white-space: pre-wrap; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 14px;
  }
  .ro-banner {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    padding: 11px 15px; border-radius: 10px; font-size: 13px;
    background: rgba(34,197,94,.07); border: 1px solid rgba(34,197,94,.3); color: var(--dim);
  }
  .ro-banner b { color: var(--ok); }
  .sa-box {
    margin-bottom: 16px; padding: 12px 15px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border-2); font-size: 13px;
  }
  .sa-box .lbl { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .sa-box .val { color: var(--accent); word-break: break-all; margin-top: 3px; }
  .sa-box .hint { color: var(--dim2); font-size: 12px; margin-top: 6px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--dim2); font-size: 13px; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.02); }
  }
  .spin { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--border-2); border-top-color: var(--accent);
    animation: spin 1s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .flash { position: fixed; bottom: 24px; right: 24px; z-index: 20;
    padding: 12px 18px; background: var(--panel); border: 1px solid var(--accent);
    border-radius: 10px; box-shadow: 0 0 30px rgba(34,211,238,.4); font-size: 13px;
    transform: translateY(120%); transition: transform .3s ease; }
  .flash.show { transform: translateY(0); }
  .flash.err { border-color: var(--danger); box-shadow: 0 0 30px rgba(239,68,68,.4); }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="glyph">⛈️</div>
      <div>
        <h1>NIMBUS</h1>
        <small>PROJECT ONE</small>
      </div>
    </div>
    <div id="cost-strip" class="cost">
      <span class="lbl">Perplexity mo.</span>
      <span class="num" id="cost-mo">$0.00</span>
      <span class="lbl">/</span>
      <span class="num" id="cost-cap">$150.00</span>
    </div>
    <span class="badge"><span class="dot" id="ppx-dot"></span> <span id="ppx-label">sonar</span></span>
    <span class="badge" id="ppx-status"><span class="dot off"></span> checking</span>
    <a class="exit" href="/">Exit Nimbus</a>
  </header>

  <nav id="nav">
    <a href="/nimbus/" data-route="/nimbus/">⚡ Dashboard</a>
    <a href="/nimbus/marketing/topics" data-route="/nimbus/marketing/topics">📈 Trending Topics</a>
    <a href="/nimbus/marketing/drafts" data-route="/nimbus/marketing/drafts">📝 Content Drafts</a>
    <a href="/nimbus/marketing/seo" data-route="/nimbus/marketing/seo">🔍 Local SEO</a>
    <a href="/nimbus/marketing/social" data-route="/nimbus/marketing/social">📣 Social &amp; GBP</a>
    <a href="/nimbus/marketing/connections" data-route="/nimbus/marketing/connections">🔌 Connections</a>
    <a href="/nimbus/settings" data-route="/nimbus/settings">⚙️ Settings</a>
  </nav>

  <main id="main"></main>

  <div id="flash" class="flash"></div>

<script>
'use strict';

const BASE = '/nimbus';
const state = { settings: {}, territories: [], runs: {}, activeTimers: {} };

/* ── router ────────────────────────────────────────────────────────────── */

function route() {
  const path = location.pathname.replace(/\/$/, '') || '/nimbus';
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('on', a.dataset.route.replace(/\/$/, '') === path);
  });
  if (path.startsWith('/nimbus/marketing/topics')) return renderTopics();
  if (path.startsWith('/nimbus/marketing/drafts')) return renderDrafts();
  if (path.startsWith('/nimbus/marketing/connections')) return renderConnections();
  if (path.startsWith('/nimbus/marketing/seo')) return renderSeo();
  if (path.startsWith('/nimbus/marketing/social')) return renderSocial();
  if (path.startsWith('/nimbus/settings'))          return renderSettings();
  if (path.startsWith('/nimbus/rep/'))              return renderRep(path.split('/').pop());
  return renderDashboard();
}

document.body.addEventListener('click', ev => {
  const a = ev.target.closest('a[data-route]');
  if (!a) return;
  ev.preventDefault();
  history.pushState({}, '', a.href);
  route();
});
window.addEventListener('popstate', route);

/* ── flash ─────────────────────────────────────────────────────────────── */

function flash(msg, err) {
  const el = document.getElementById('flash');
  el.textContent = msg;
  el.className = 'flash show' + (err ? ' err' : '');
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { el.className = 'flash' + (err ? ' err' : ''); }, 3800);
}

/* ── shared header data ───────────────────────────────────────────────── */

async function refreshSettings() {
  const r = await fetch(`${BASE}/api/settings`).then(r => r.json());
  state.settings = r;
  const spent = Number(r.month_spend_usd || 0);
  const cap = Number(r.monthly_spend_cap_usd || 150);
  const pct = cap ? spent / cap : 0;
  document.getElementById('cost-mo').textContent  = '$' + spent.toFixed(2);
  document.getElementById('cost-cap').textContent = '$' + cap.toFixed(2);

async function startRun(rep, dryRun) {
  const btn = document.querySelector(`.rep[data-rep="${rep}"] .run-b2b`);
  const dry = document.querySelector(`.rep[data-rep="${rep}"] .dry-b2b`);
  btn.disabled = dry.disabled = true;
  btn.innerHTML = '<span class="spin"></span> starting';
  try {
    const r = await fetch(`${BASE}/api/b2b/run`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ rep: rep, dry_run: dryRun })
    });
    if (!r.ok) throw new Error((await r.json()).error || 'run failed');
    const data = await r.json();
    flash(`${rep}: run #${data.run_id} started${dryRun ? ' (dry)' : ''}`);
    pollRun(rep, data.run_id, btn, dry);
  } catch (e) {
    flash(rep + ': ' + e.message, true);
    btn.disabled = dry.disabled = false;
    btn.innerHTML = '▶ RUN';
  }
}

function pollRun(rep, runId, btn, dry) {
  if (state.activeTimers[rep]) clearInterval(state.activeTimers[rep]);
  const statusEl = document.querySelector(`[data-status="${rep}"]`);
  state.activeTimers[rep] = setInterval(async () => {
    const r = await fetch(`${BASE}/api/runs/${runId}`).then(r => r.json());
    statusEl.textContent = `run #${runId}: ${r.status}  found ${r.leads_found}  pushed ${r.leads_pushed}  deduped ${r.leads_deduped}  $${(r.cost_usd || 0).toFixed(3)}`;
    if (r.status === 'ok' || r.status === 'error') {
      clearInterval(state.activeTimers[rep]);
      delete state.activeTimers[rep];
      btn.disabled = dry.disabled = false;
      btn.innerHTML = '▶ RUN';
      flash(rep + ': ' + (r.status === 'ok' ? 'run complete' : 'run failed'), r.status === 'error');
      refreshSettings();
    }
  }, 2500);
}

async function loadPipeline() {
  let pl;
  try { pl = await fetch(`${BASE}/api/pipeline`).then(r => r.json()); }
  catch { pl = null; }
  const box = document.getElementById('pipeline');
  if (!pl || pl.error) { box.innerHTML = '<div class="empty">no pipeline data</div>'; return; }
  const stageOrder = ['new','contacted','appt_set','inspected','estimate_presented','follow_up','won','lost'];
  const labels = {
    new:'NEW', contacted:'CONTACTED', appt_set:'APPT SET', inspected:'INSPECTED',
    estimate_presented:'PRESENTED', follow_up:'FOLLOW-UP', won:'WON', lost:'LOST'
  };
  const total = Math.max(1, ...Object.values(pl.stage_counts || {}));
  const rows = stageOrder.map(k => {
    const n = pl.stage_counts[k] || 0;
    const pct = Math.round((n / total) * 100);
    return `<div class="stage-row"><span class="lbl">${labels[k]}</span>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <span class="num">${n}</span></div>`;
  }).join('');
  document.getElementById('pl-count').textContent = pl.open_leads + ' open';
  box.innerHTML = `
    <div class="stages">${rows}</div>
    <div class="kv"><span class="k">$ open pipeline</span><span class="v">$${Number(pl.open_value).toLocaleString(undefined,{maximumFractionDigits:0})}</span></div>

  main.innerHTML = `

      here is a measured ranking, traffic figure or competitor metric — findings

      sources attached. Every item needs a human before anything changes.</span>
    </div>

    <div class="seo-bar">
      <button id="seo-run" onclick="startSeo(false)" ${busy ? 'disabled' : ''}>
        ${busy ? 'Running…' : 'Run weekly analysis'}
      </button>
      <button class="ghost" onclick="startSeo(true)" ${busy ? 'disabled' : ''}>Dry run</button>
      <button class="ghost" onclick="showApproved()">Approved →&nbsp;briefs</button>
      <select id="seo-filter" onchange="filterRecs()">
        <option value="">All categories</option>
        ${Object.entries(CAT_LABEL).map(([k, v]) =>
          `<option value="${k}">${v}</option>`).join('')}
      </select>
      <span style="color:var(--dim2);font-size:12px">
        ${last ? `last run #${last.id} · ${escapeHtml(last.status)} · ${last.pages_crawled} pages · $${(last.cost_usd||0).toFixed(3)}`
               : 'no runs yet'}
      </span>
    </div>

    <div id="seo-live"></div>

    <section class="panel" style="margin-bottom:18px">
      <h2>Questions we actually hear
        <span class="count" id="fn-count">—</span></h2>
      <div style="color:var(--dim2);font-size:12px;margin-bottom:12px;line-height:1.6">
        Two sources, both ours, both free. <b style="color:var(--dim)">Your CRM</b>
        is mined automatically for questions that come up more than once.
        <b style="color:var(--dim)">Field notes</b> are what you type in below —
        reading r/FortCollins at night, something a rep mentions in the truck,
        an HOA meeting. Write the <i>question</i> in your own words; don't paste
        anyone's post.
      </div>
      <div class="settings" style="max-width:none;margin-bottom:14px">
        <input id="fn-q" placeholder="What did they ask? e.g. Does my insurance cover a 12-year-old roof?"
               onkeydown="if(event.key==='Enter')addFieldNote()">
        <div class="row" style="grid-template-columns:1fr 1fr auto">
          <input id="fn-where" placeholder="Where you heard it — r/Denver, phone call, HOA meeting">
          <input id="fn-city" placeholder="City (optional)">
          <button onclick="addFieldNote()">Add</button>
        </div>
      </div>
      <div id="fn-list"></div>
      <div id="crm-q" style="margin-top:14px"></div>
    </section>

    <section class="panel">
      <h2>Recommendation queue <span class="count" id="rec-count">${recs.length} pending</span></h2>
      <div id="rec-list">

                      : '<div class="empty">Nothing pending. Run the weekly analysis to build a queue.</div>'}
      </div>
    </section>

    <section class="panel" style="margin-top:18px">
      <h2>Latest weekly report ${reportBody.report
        ? `<span class="count">week of ${escapeHtml(reportBody.report.week_of)}</span>` : ''}</h2>
      ${reportBody.report
        ? `<div class="md">${escapeHtml(reportBody.report.markdown)}</div>`
        : '<div class="empty">No report saved yet.</div>'}

  loadFieldNotes();
  loadCrmQuestions();

/* Field notes: the compliant route for anything you read on Reddit at night.
   You read, you paraphrase, you type. Nothing is scraped. */
async function loadFieldNotes() {
  const notes = await fetch(`${BASE}/api/seo/field-notes?status=new`)
    .then(r => r.json()).catch(() => []);
  const c = document.getElementById('fn-count');
  if (c) c.textContent = `${notes.length} waiting to be used`;
  const box = document.getElementById('fn-list');
  if (!box) return;
  box.innerHTML = notes.length ? notes.map(n => `
    <div class="topic" data-fn="${n.id}">
      <div class="t-hd">
        <h4>${escapeHtml(n.question)}</h4>
        <button class="btn ghost" style="padding:2px 9px;font-size:11px;border-radius:6px;
          background:transparent;color:var(--dim);border:1px solid var(--border-2);cursor:pointer"
          onclick="archiveFieldNote(${n.id})">Remove</button>
      </div>
      <p>${escapeHtml(n.heard_where || 'source not noted')}${
        n.city ? ' · ' + escapeHtml(n.city) : ''}${
        n.created_by ? ' · added by ' + escapeHtml(n.created_by) : ''}</p>
    </div>`).join('')
    : '<div style="color:var(--dim2);font-size:12px">Nothing yet. Add one above — '
      + 'it goes into the next weekly analysis.</div>';
}

async function addFieldNote() {
  const q = document.getElementById('fn-q');
  if (!q.value.trim()) return;
  const r = await fetch(`${BASE}/api/seo/field-notes`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      question: q.value,
      heard_where: document.getElementById('fn-where').value,
      city: document.getElementById('fn-city').value,
    }),
  });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { flash(body.error || 'Could not add that', true); return; }
  q.value = '';
  document.getElementById('fn-where').value = '';
  flash('Added — it will feed the next analysis');
  loadFieldNotes();
}

async function archiveFieldNote(id) {
  await fetch(`${BASE}/api/seo/field-notes/${id}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status: 'archived'}),
  });
  loadFieldNotes();
}

async function loadCrmQuestions() {
  const box = document.getElementById('crm-q');
  if (!box) return;
  const out = await fetch(`${BASE}/api/seo/crm-questions`)
    .then(r => r.json()).catch(() => null);
  if (!out) return;
  if (!out.available) {
    box.innerHTML = `<div style="color:var(--dim2);font-size:12px;
      border-top:1px solid var(--border);padding-top:12px">
      <b style="color:var(--dim)">From the CRM:</b> ${escapeHtml(out.note || 'unavailable')}</div>`;
    return;
  }
  box.innerHTML = `
    <div style="border-top:1px solid var(--border);padding-top:12px">
      <div style="color:var(--dim);font-size:12px;margin-bottom:8px">
        <b>From the CRM</b> — ${escapeHtml(out.note)}
        <span style="color:var(--dim2)"> · read-only, ${out.notes_scanned} note(s) scanned</span>
      </div>
      ${(out.questions || []).slice(0, 8).map(q => `
        <div class="topic" style="border-left-color:var(--ok)">
          <div class="t-hd">
            <h4>${escapeHtml(q.question)}</h4>
            <span class="score" style="color:var(--ok)">×${q.mentions}</span>
          </div>
          <p>${escapeHtml(q.why_it_matters)}</p>
        </div>`).join('')
        || '<div style="color:var(--dim2);font-size:12px">No recurring themes yet.</div>'}
    </div>`;
}

function recCard(r, rank) {
  const ctx = [r.city, r.service].filter(Boolean).join(' · ');
  const basis = r.evidence_basis === 'owned_data' ? 'Owned data' :
    (['improve_existing_page','technical_website_fix','internal_linking_opportunity']
      .includes(r.category) ? 'Observed on our site' : 'Public-research opportunity');
  return `
    <div class="rec ${escapeHtml(r.status || 'pending')}" data-rec="${r.id}"
         data-cat="${escapeHtml(r.category)}">
      <div class="head">
        <span class="rank">#${rank}</span>
        <span class="cat ${escapeHtml(r.category)}">${CAT_LABEL[r.category] || escapeHtml(r.category)}</span>
        <span class="basis">${basis}</span>
        <span class="conf">confidence: ${escapeHtml(r.confidence || 'low')}</span>
        <span class="score">${Number(r.score || 0).toFixed(1)}</span>
      </div>
      <div class="action">${escapeHtml(r.action)}</div>
      ${ctx ? `<div class="ctx">${escapeHtml(ctx)}</div>` : ''}
      ${r.intent ? `<div class="intent">“${escapeHtml(r.intent)}”</div>` : ''}
      ${r.rationale ? `<div class="why">${escapeHtml(r.rationale)}</div>` : ''}
      ${r.review_notes ? `<div class="check">⚠ Before acting: ${escapeHtml(r.review_notes)}</div>` : ''}
      ${(r.evidence || []).length ? `<div class="ev">${
        (r.evidence || []).slice(0, 6).map(u => u.startsWith('http')
          ? `<a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(hostname(u))}</a>`
          : `<a>${escapeHtml(u)}</a>`).join('')}</div>` : ''}
      <div class="acts">
        ${r.status === 'approved'
          ? `<button class="ok" onclick="makeBrief(${r.id})">Create content brief</button>`
          : `<button class="ok" onclick="reviewRec(${r.id}, 'approved')">Approve</button>
             <button class="no" onclick="reviewRec(${r.id}, 'rejected')">Reject</button>`}
      </div>
    </div>`;
}

function filterRecs() {
  const want = document.getElementById('seo-filter').value;
  document.querySelectorAll('.rec').forEach(el => {
    el.style.display = (!want || el.dataset.cat === want) ? '' : 'none';
  });
}

async function startSeo(dryRun) {
  const r = await fetch(`${BASE}/api/seo/run`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({dry_run: !!dryRun}),
  });
  if (r.status === 409) { flash('A run is already in progress', true); return; }
  if (!r.ok) { flash('Could not start the run', true); return; }
  flash(dryRun ? 'Dry run started — nothing will be saved' : 'Analysis started');
  document.getElementById('seo-run').disabled = true;
  document.getElementById('seo-live').innerHTML =
    '<div class="conn"><div class="detail"><span class="spin"></span> '
    + (dryRun ? 'Dry run in progress — crawling, no writes' : 'Crawling and researching…')
    + '</div></div>';
  pollSeo(dryRun);
}

function pollSeo(dryRun) {
  clearInterval(seoPoll);
  seoPoll = setInterval(async () => {
    const s = await fetch(`${BASE}/api/seo/result`).then(r => r.json()).catch(() => null);
    if (!s || s.running) return;
    clearInterval(seoPoll);
    const m = s.manifest || {};
    if (!m.ok) {
      document.getElementById('seo-live').innerHTML =
        `<div class="conn" style="border-color:var(--danger)">
           <div class="detail" style="color:var(--danger)">Run failed: ${escapeHtml(m.error || 'unknown error')}</div>
         </div>`;
      flash('Run failed', true);
      return;
    }
    if (dryRun) {
      // A dry run saves nothing, so this in-memory manifest is the only copy.
      document.getElementById('seo-live').innerHTML = `
        <section class="panel" style="margin-bottom:18px;border-color:var(--violet)">
          <h2>Dry run — nothing was saved
            <span class="count">${(m.recommendations || []).length} would be created</span></h2>
          <div style="color:var(--dim);font-size:13px;margin-bottom:12px">
            ${m.pages_crawled} pages crawled · ${m.skipped_by_robots} skipped by robots.txt ·
            research: ${escapeHtml(m.research_note || '—')} · cost $${(m.cost_usd || 0).toFixed(3)}
          </div>
          ${(m.recommendations || []).slice(0, 20).map((r, i) => recCard({...r, id: 0}, i + 1)).join('')}
          ${(m.dropped || []).length ? `<div style="color:var(--dim2);font-size:12px;margin-top:10px">
            ${m.dropped.length} dropped by the honesty checks:
            ${m.dropped.slice(0, 5).map(d => escapeHtml(d.reason)).join(' · ')}</div>` : ''}
        </section>`;
      flash('Dry run complete — nothing saved');
    } else {
      flash('Analysis complete');
      renderSeo();
    }
  }, 2000);
}

async function makeBrief(id) {
  const r = await fetch(`${BASE}/api/seo/recommendations/${id}/brief`, {method: 'POST'});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { flash(body.error || 'Could not build a brief', true); return; }
  flash('Brief created');
  document.getElementById('seo-live').innerHTML = `
    <section class="panel" style="margin-bottom:18px;border-color:var(--accent)">
      <h2>Content brief <span class="count">${escapeHtml(body.brief.page_type.replace(/_/g,' '))}</span></h2>
      <div class="md">${escapeHtml(body.markdown)}</div>
    </section>`;
  document.getElementById('seo-live').scrollIntoView({behavior: 'smooth'});
}

async function showApproved() {
  const recs = await fetch(`${BASE}/api/seo/recommendations?status=approved`)
    .then(r => r.json()).catch(() => []);
  document.getElementById('rec-list').innerHTML = recs.length
    ? recs.map((r, i) => recCard(r, i + 1)).join('')
    : '<div class="empty">Nothing approved yet.</div>';
  document.getElementById('rec-count').textContent = `${recs.length} approved`;
}

async function reviewRec(id, status) {
  if (!id) { flash('Dry-run items cannot be approved — run for real first', true); return; }
  const r = await fetch(`${BASE}/api/seo/recommendations/${id}`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({status}),
  });
  if (!r.ok) { flash('Could not record that', true); return; }
  const el = document.querySelector(`.rec[data-rec="${id}"]`);
  if (el) el.remove();
  const left = document.querySelectorAll('.rec').length;
  const c = document.getElementById('rec-count');
  if (c) c.textContent = `${left} pending`;
  flash(status === 'approved' ? 'Approved — recorded, not actioned' : 'Rejected');
}

/* Read-only status board. The API returns env var NAMES and set/unset flags,
   never values, so there is nothing secret to leak on this page. */

const STATUS_LABEL = {
  connected: 'Connected', not_connected: 'Not Connected', error: 'Error',
  owner_required: 'Owner Access Required', unchecked: 'Not Checked',
  approval_required: 'Approval Required',
};
const AUTH_LABEL = {
  service_account: 'read-only service account', oauth: 'Google OAuth login',
  none: 'no credential needed', unknown: 'not yet specified',
  api_key: 'app key + secret',
};

async function renderConnections(probe) {
  const main = document.getElementById('main');
  if (!main.querySelector('.conn')) {
    main.innerHTML = '<div class="empty"><span class="spin"></span> loading connections</div>';
  }
  let data;
  try {
    data = await fetch(`${BASE}/api/connections?probe=${probe === false ? 0 : 1}`)
      .then(r => r.json());
  } catch (e) {
    main.innerHTML = '<div class="empty">could not load connection status</div>';
    return;
  }
  const s = data.summary || {};
  const rows = data.connections || [];

  main.innerHTML = `
    <div class="ro-banner">
      🔒 <span><b>Read-only, v1.</b> Every connection below is fetched with HTTP GET only.
      Nimbus does not publish, send email, edit the website, or write to the CRM.</span>
    </div>

    ${s.google_auth_installed === false ? `
      <div class="conn" style="border-color:var(--warn)">
        <div class="detail" style="color:var(--warn)">
          The <code>google-auth</code> package is not installed, so the Google
          service-account connections cannot authenticate. Add it to
          requirements.txt and redeploy.
        </div>
      </div>` : ''}

    <div class="sa-box">
      <div class="lbl">Shared service account (non-secret — this is the address you grant)</div>
      <div class="val mono">${s.service_account_email
        ? escapeHtml(s.service_account_email)
        : '<span style="color:var(--dim2)">not set — no service account key configured yet</span>'}</div>
      <div class="hint">Grant this address read access in GA4 and Search Console.
        Its private key stays in the Railway env var and is never shown here.</div>
    </div>

    <section class="panel">
      <h2>
        Marketing connections
        <span class="count">${
          rows.filter(r => r.status === 'connected').length}/${
          rows.filter(r => r.tier !== 'optional_future').length} active connected${
          rows.some(r => r.tier === 'optional_future')
            ? ` · ${rows.filter(r => r.tier === 'optional_future').length} optional` : ''}</span>
      </h2>
      <div style="margin-bottom:14px">
        <button class="btn" id="recheck" onclick="recheckConnections()"
          style="padding:7px 14px;font-size:12px;border-radius:7px;background:var(--gradient);color:#001;font-weight:700;border:none;cursor:pointer;font-family:inherit">
          Re-check all
        </button>
        <span style="color:var(--dim2);font-size:12px;margin-left:10px">
          Each check is a single read-only request. Nothing is written.
        </span>
      </div>
      ${rows.map(connCard).join('')}
    </section>
  `;
}

function connCard(c) {
  const envPills = [
    ...(c.secret_env || []).map(e => `
      <span class="env ${e.set ? 'set' : 'unset required'}" title="secret — value never shown">
        ${e.set ? '●' : '○'} ${escapeHtml(e.name)}
      </span>`),
    ...(c.id_env || []).map(e => `
      <span class="env ${e.set ? 'set' : (e.optional ? 'unset' : 'unset required')}">
        ${e.set ? '●' : '○'} ${escapeHtml(e.name)}${e.optional && !e.set ? ' (optional)' : ''}${
          e.set && e.value ? ' = ' + escapeHtml(e.value) : ''}
      </span>`),
  ].join('');

  const ids = (c.id_env || []).filter(e => e.where);
  const optional = c.tier === 'optional_future' || c.tier === 'blocked_external';
  return `
    <div class="conn${optional ? ' optional' : ''}" data-conn="${escapeHtml(c.key)}">
      <div class="head">
        <span class="name">${escapeHtml(c.label)}</span>
        <span class="pill ${escapeHtml(c.status)}">${STATUS_LABEL[c.status] || c.status}</span>
        ${c.tier === 'optional_future'
            ? '<span class="tier">Optional — future enhancement</span>' : ''}
        ${c.tier === 'blocked_external'
            ? '<span class="tier">Gated by the provider</span>' : ''}
        <span class="authtag">${AUTH_LABEL[c.auth] || escapeHtml(c.auth)}</span>
      </div>
      ${c.detail ? `<div class="detail">${escapeHtml(c.detail)}</div>` : ''}
      ${c.reads ? `<div class="reads">Reads: ${escapeHtml(c.reads)}</div>` : ''}
      ${c.caveat ? `<div class="caveat">⚠ ${escapeHtml(c.caveat)}</div>` : ''}
      ${envPills ? `<div class="envs">${envPills}</div>` : ''}
      ${(c.grant || ids.length) ? `
        <details>
          <summary>Setup steps</summary>
          <div class="howto">
            ${c.grant ? `<div><b>Grant access:</b> ${escapeHtml(c.grant)}</div>` : ''}
            ${ids.map(e => `<div style="margin-top:6px"><b>${escapeHtml(e.name)}</b> —
              ${escapeHtml(e.where)}${e.example ? ` Example: <code>${escapeHtml(e.example)}</code>` : ''}</div>`).join('')}
            ${(c.scopes || []).length ? `<div style="margin-top:6px"><b>Scope:</b>
              <code>${c.scopes.map(escapeHtml).join('</code> <code>')}</code>
              ${c.scope_is_readonly ? '(read-only)' : '(no read-only scope exists — see warning above)'}</div>` : ''}
          </div>
        </details>` : ''}
    </div>`;
}

async function recheckConnections() {
  const btn = document.getElementById('recheck');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  document.querySelectorAll('.conn .pill').forEach(p => {
    p.className = 'pill checking'; p.textContent = 'Checking…';
  });
  await renderConnections(true);
  flash('Connection check complete');
}

async function saveRep(username) {
  const patch = {
    cities:            document.getElementById('c-cities').value.split(',').map(s => s.trim()).filter(Boolean),
    counties:          document.getElementById('c-counties').value.split(',').map(s => s.trim()).filter(Boolean),
    segments:          document.getElementById('c-segments').value.split(',').map(s => s.trim()).filter(Boolean),
    monthly_lead_cap:  Number(document.getElementById('c-cap').value || 0),
    enrich_top_n:      Number(document.getElementById('c-top').value || 0),
  };
  const r = await fetch(`${BASE}/api/territories/${username}`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(patch)
  });
  if (r.ok) flash('Saved');
  else flash('Save failed', true);
}

/* ── helpers ───────────────────────────────────────────────────────────── */

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function hostname(u) {
  try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; }
}

/* ── boot ──────────────────────────────────────────────────────────────── */
refreshSettings();
route();
</script>
